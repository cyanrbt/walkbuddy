name: Experimental brightness stages

on:
  workflow_dispatch:
  push:
    branches: [perf/brightness-async-a110908]
    paths:
      - .github/workflows/brightness-stages.yml
      - scripts/preview_trace.sql
      - scripts/record_preview_trace.py
      - app/src/main/java/com/cyanrbt/walkbuddy/BrightnessReadback.java
      - app/src/main/java/com/cyanrbt/walkbuddy/PreviewActivity.java
      - app/src/androidTest/java/com/cyanrbt/walkbuddy/DrawBrightnessProbe.java
      - app/src/androidTest/java/com/cyanrbt/walkbuddy/PipProbe.java

permissions:
  contents: read

jobs:
  stages:
    uses: ./.github/workflows/ui-check.yml
    with:
      preview_trace: true
