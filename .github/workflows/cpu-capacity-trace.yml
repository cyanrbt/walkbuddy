name: CPU capacity trace

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/cpu-capacity-trace.yml
      - .github/workflows/ui-check.yml
      - scripts/record_ui_cpu.py
      - scripts/ui_probe_setup.sh
      - app/src/androidTest/java/com/cyanrbt/walkbuddy/PipProbe.java
      - app/src/androidTest/java/com/cyanrbt/walkbuddy/PreviewReadinessProbe.java
      - app/src/main/java/com/cyanrbt/walkbuddy/PreviewActivity.java
      - app/src/androidTest/java/com/cyanrbt/walkbuddy/LayoutProbe.java
      - app/src/androidTest/java/com/cyanrbt/walkbuddy/ViewfinderLayoutProbe.java
      - app/src/androidTest/java/com/cyanrbt/walkbuddy/ViewfinderProbe.java
      - app/src/main/java/com/cyanrbt/walkbuddy/PreviewChrome.java
      - app/src/main/java/com/cyanrbt/walkbuddy/PreviewStatus.java
      - app/src/main/java/com/cyanrbt/walkbuddy/PreviewRecovery.java
      - app/src/androidTest/java/com/cyanrbt/walkbuddy/RecoveryPresentationProbe.java
      - app/src/main/res/layout/activity_preview.xml
      - app/src/main/res/values/strings.xml
      - app/src/main/java/com/cyanrbt/walkbuddy/SessionState.java
      - app/src/main/java/com/cyanrbt/walkbuddy/BrightnessReadback.java
      - app/src/androidTest/java/com/cyanrbt/walkbuddy/RejectedTouch.java
      - app/src/androidTest/assets/restore-down-paused.txt

permissions:
  contents: read

jobs:
  trace:
    uses: ./.github/workflows/ui-check.yml
    with:
      preview_trace: true
      emulator_cores: 4
