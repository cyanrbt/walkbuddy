name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  ui:
    uses: ./.github/workflows/ui-check.yml
    permissions:
      contents: read

  apk:
    needs: ui
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Check release tag and notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/check_release.py "$RELEASE_TAG"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore fixed signing key
        env:
          SIGNING_KEYSTORE_DIR: ${{ runner.temp }}/walkbuddy-signing
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: bash scripts/prepare_signing.sh

      - uses: android-actions/setup-android@v4

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Check model
        run: python3 scripts/check_model.py

      - name: Test and build arm64 debug APK
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon --no-watch-fs

      - name: Verify APK signature matches restored key
        run: bash scripts/verify_apk_signing.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Walk-Buddy-${GITHUB_REF_NAME}-arm64-debug.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          asset="Walk-Buddy-${tag}-arm64-debug.apk"
          notes="docs/releases/${tag}.md"
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${asset}" --clobber
            gh release edit "${tag}" --notes-file "${notes}"
          else
            gh release create "${tag}" "${asset}" --title "WalkBuddy ${tag}" --notes-file "${notes}"
          fi
