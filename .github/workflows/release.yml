name: Release APK

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties

      - name: Check model
        run: python3 scripts/check_model.py

      - name: Use debug keystore secret
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "${HOME}/.android"
          if [ -n "${DEBUG_KEYSTORE_BASE64}" ]; then
            printf '%s' "${DEBUG_KEYSTORE_BASE64}" | tr -d '\n ' | base64 -d > "${HOME}/.android/debug.keystore"
            echo "USING_SECRET=1" >> "${GITHUB_ENV}"
          fi

      - name: Restore cached debug keystore
        if: env.USING_SECRET != '1'
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: walkbuddy-debug-keystore-v1

      - name: Ensure debug keystore
        run: |
          mkdir -p "${HOME}/.android"
          if [ ! -f "${HOME}/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "${HOME}/.android/debug.keystore" \
              -storepass android -keypass android -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=WalkBuddy Debug, OU=WalkBuddy, O=WalkBuddy, L=Debug, ST=Debug, C=US"
          fi
          keytool -list -keystore "${HOME}/.android/debug.keystore" -storepass android

      - name: Test and build arm64 debug APK
        run: bash ./gradlew testDebugUnitTest assembleDebug --no-daemon --no-watch-fs

      - name: Collect APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "WalkBuddy-${GITHUB_REF_NAME}-arm64-debug.apk"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF_NAME}"
          asset="WalkBuddy-${tag}-arm64-debug.apk"
          cat > /tmp/release-notes.md <<EOF
          ARM64 调试包，最低 Android 8。安装后在首页依次允许摄像头、悬浮窗和通知，再自己点开启。识别和提示音默认关闭。

          这是学习原型。没有提醒不代表安全。不要在道路、楼梯或骑行时靠它决定下一步。画面不保存、不上传，安装包没有网络权限。

          调试签名在本仓库的构建缓存里重复使用。系统若拒绝覆盖安装，先卸载旧包再装。
          EOF
          if gh release view "${tag}" >/dev/null 2>&1; then
            gh release upload "${tag}" "${asset}" --clobber
            gh release edit "${tag}" --notes-file /tmp/release-notes.md
          else
            gh release create "${tag}" "${asset}" --title "WalkBuddy ${tag}" --notes-file /tmp/release-notes.md
          fi
