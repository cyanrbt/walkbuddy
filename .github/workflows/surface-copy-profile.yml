name: Surface copy experiment

on:
  workflow_dispatch:
  push:
    branches: [main, perf/brightness-async-a110908]
    paths:
      - .github/workflows/surface-copy-profile.yml
      - scripts/run_surface_copy_profile.sh
      - app/src/androidTest/java/com/cyanrbt/walkbuddy/SurfaceCopyProbe.java
      - app/src/androidTest/java/com/cyanrbt/walkbuddy/SurfaceProducerProbe.java
      - app/src/androidTest/java/com/cyanrbt/walkbuddy/BrightnessReadbackProbe.java
      - app/src/androidTest/java/com/cyanrbt/walkbuddy/DrawBrightnessProbe.java
      - app/src/main/java/com/cyanrbt/walkbuddy/PreviewActivity.java
      - app/src/main/java/com/cyanrbt/walkbuddy/Brightness*.java

permissions:
  contents: read

jobs:
  compare:
    uses: ./.github/workflows/ui-check.yml
    with:
      surface_copy_profile: true
