name: Android UI checks

on:
  push:
    branches: [main]
    paths-ignore:
      - docs/**
      - experiments/**
      - README.md
      - .github/workflows/model-candidate-audit.yml
  workflow_call:
    inputs:
      scheduling_profile:
        type: boolean
        default: false
      thread_profile:
        type: boolean
        default: false
      preview_trace:
        type: boolean
        default: false
      surface_copy_profile:
        type: boolean
        default: false
      emulator_cores:
        type: number
        default: 2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: ${{ fromJSON(inputs.surface_copy_profile && '[26,35,36]' || '[35,36]') }}
    steps:
      - uses: actions/checkout@v4
      - name: Test CI report interpretation
        run: python3 -m unittest discover -s scripts/tests -v
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install build SDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
      - name: Create disposable test signing key
        run: |
          test_keystore="${RUNNER_TEMP}/walkbuddy-ui-test.keystore"
          keytool -genkeypair -noprompt -keystore "$test_keystore" -storepass android -keypass android -alias androiddebugkey -dname CN=WalkBuddyUITest -keyalg RSA -keysize 2048 -validity 1
          echo "WALKBUDDY_SIGNING_KEYSTORE=${test_keystore}" >> "$GITHUB_ENV"
      - name: Build emulator test APKs
        id: build
        run: |
          bash scripts/fetch_test_fixture.sh
          ./gradlew assembleDebug assembleDebugAndroidTest -PuniversalApk --no-daemon --no-watch-fs
      - name: Prepare pinned system trace analyzer
        if: inputs.preview_trace
        run: |
          bash scripts/fetch_trace_processor.sh "${RUNNER_TEMP}/walkbuddy-perfetto"
          echo "WALKBUDDY_TRACE_PROCESSOR=${RUNNER_TEMP}/walkbuddy-perfetto/trace_processor_shell" >> "$GITHUB_ENV"
      - name: Free hosted runner storage after compilation
        run: |
          mkdir -p ui-evidence
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT python3 scripts/prepare_ui_storage.py \
            --workspace "$GITHUB_WORKSPACE" --sdk "$ANDROID_HOME" \
            --gradle-home "${GRADLE_USER_HOME:-$HOME/.gradle}" --avd-home "$HOME" \
            --report ui-evidence/runner-storage.json
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Record and bound emulator CPU capacity
        id: cpu
        env:
          REQUESTED_CORES: ${{ inputs.emulator_cores || 2 }}
        run: python3 scripts/record_ui_cpu.py host --cores "$REQUESTED_CORES" --report ui-evidence/runner-cpu.json
      - name: Run Android UI and virtual camera checks
        id: emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        env:
          WALKBUDDY_EMULATOR_CORES: ${{ steps.cpu.outputs.cores }}
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          cores: ${{ steps.cpu.outputs.cores }}
          # The disposable test data fits in 2 GiB; image defaults can exceed runner free space.
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back emulated -camera-front none
          script: bash scripts/${{ inputs.surface_copy_profile && 'run_surface_copy_profile' || inputs.preview_trace && 'run_preview_traces' || inputs.thread_profile && 'run_thread_profiles' || inputs.scheduling_profile && 'run_scheduling_profiles' || 'run_ui_probes' }}.sh
      - name: Summarize preview trace evidence
        if: always() && inputs.preview_trace
        run: |
          if test -f ui-evidence/preview-trace/summary.md; then
            cat ui-evidence/preview-trace/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Summarize build, probes and system evidence
        if: always()
        env:
          BUILD_RESULT: ${{ steps.build.outcome }}
          EMULATOR_RESULT: ${{ steps.emulator.outcome }}
          PROBE_MODE: ${{ inputs.surface_copy_profile && matrix.api-level == 26 && 'surface' || inputs.thread_profile && 'thread' || inputs.scheduling_profile && 'scheduling' || 'ui' }}
        run: |
          python3 scripts/report_ui_checks.py ui-evidence \
            --build-result "${BUILD_RESULT:-skipped}" \
            --emulator-result "${EMULATOR_RESULT:-skipped}" --mode "$PROBE_MODE"
          cat ui-evidence/check-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-evidence-api-${{ matrix.api-level }}
          path: ui-evidence/
          if-no-files-found: warn
