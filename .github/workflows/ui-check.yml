name: Android UI checks

on:
  push:
    branches: [main]
  workflow_call:
    inputs:
      scheduling_profile:
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Install build SDK
        run: |
          sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=${ANDROID_HOME}" > local.properties
      - name: Create disposable test signing key
        run: |
          test_keystore="${RUNNER_TEMP}/walkbuddy-ui-test.keystore"
          keytool -genkeypair -noprompt -keystore "$test_keystore" -storepass android -keypass android -alias androiddebugkey -dname CN=WalkBuddyUITest -keyalg RSA -keysize 2048 -validity 1
          echo "WALKBUDDY_SIGNING_KEYSTORE=${test_keystore}" >> "$GITHUB_ENV"
      - name: Build emulator test APKs
        run: |
          bash scripts/fetch_test_fixture.sh
          ./gradlew assembleDebug assembleDebugAndroidTest -PuniversalApk --no-daemon --no-watch-fs
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android UI and virtual camera checks
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back emulated -camera-front none
          script: bash scripts/${{ inputs.scheduling_profile && 'run_scheduling_profiles' || 'run_ui_probes' }}.sh
      - name: Upload layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-ui-evidence-api-${{ matrix.api-level }}
          path: ui-evidence/
          if-no-files-found: warn
