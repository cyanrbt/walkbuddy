plugins { id 'com.android.application' }
android {
    namespace 'com.cyanrbt.walkbuddy'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig { applicationId 'com.cyanrbt.walkbuddy'; minSdk 26; targetSdk 36; versionCode 22; versionName '0.4.10'; testInstrumentationRunner 'com.cyanrbt.walkbuddy.RuntimeProbe'; ndk { if (!project.hasProperty('universalApk')) abiFilters 'arm64-v8a' } }
    signingConfigs {
        debug {
            def fixedKeystore = System.getenv('WALKBUDDY_SIGNING_KEYSTORE')
            if (fixedKeystore) {
                storeFile file(fixedKeystore)
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            } else if (System.getenv('GITHUB_ACTIONS') == 'true') {
                throw new GradleException('WALKBUDDY_SIGNING_KEYSTORE is required for CI releases')
            }
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    androidResources { noCompress 'tflite' }
    lint { abortOnError true }
}
dependencies { implementation 'com.google.ar:core:1.56.0'; implementation 'com.google.ai.edge.litert:litert:1.4.0'; testImplementation 'junit:junit:4.13.2' }
dependencyLocking { lockAllConfigurations() }
