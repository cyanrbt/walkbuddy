plugins { id 'com.android.application' }
android {
    namespace 'cn.study.window'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig { applicationId 'cn.study.window'; minSdk 26; targetSdk 36; versionCode 3; versionName '0.2.1'; testInstrumentationRunner 'cn.study.window.RuntimeProbe'; ndk { if (!project.hasProperty('universalApk')) abiFilters 'arm64-v8a' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    androidResources { noCompress 'tflite' }
    lint { abortOnError true }
}
dependencies { implementation 'com.google.ai.edge.litert:litert:1.4.0'; testImplementation 'junit:junit:4.13.2' }
dependencyLocking { lockAllConfigurations() }
