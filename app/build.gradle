plugins { id 'com.android.application' }
android {
    namespace 'com.cyanrbt.walkbuddy'
    compileSdk 36
    buildToolsVersion '36.0.0'
    defaultConfig { applicationId 'com.cyanrbt.walkbuddy'; minSdk 26; targetSdk 36; versionCode 10; versionName '0.3.2'; testInstrumentationRunner 'com.cyanrbt.walkbuddy.RuntimeProbe'; ndk { if (!project.hasProperty('universalApk')) abiFilters 'arm64-v8a' } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    androidResources { noCompress 'tflite' }
    lint { abortOnError true }
}
dependencies { implementation 'com.google.ai.edge.litert:litert:1.4.0'; testImplementation 'junit:junit:4.13.2' }
dependencyLocking { lockAllConfigurations() }
